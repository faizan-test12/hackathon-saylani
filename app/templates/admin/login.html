{% extends 'base.html' %}

{% block title %}Store Administration — Roast &amp; Co.{% endblock %}

{% block content %}
<div class="auth-container admin-auth">
    <div class="auth-card">
        <h2>Store Administration</h2>
        <p class="subtitle">Roast &amp; Co. Intelligence &amp; Analytics Portal</p>
        
        <form method="POST" action="{{ url_for('admin.admin_login') }}" style="margin-top: 1.5rem;">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="admin@roastandco.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Master Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Authenticate Admin</button>
        </form>
        
        <div class="auth-footer">
            <p><a href="{{ url_for('auth.login') }}">&larr; Return to Customer Store</a></p>
        </div>
    </div>
</div>
{% endblock %}
